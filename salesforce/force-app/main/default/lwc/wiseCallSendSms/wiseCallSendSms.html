<template>
 <template lwc:if={isQuickAction}>
  <lightning-quick-action-panel header="Send SMS">
   <div class="slds-var-p-horizontal_x-small">
    <template lwc:if={context}>
     <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">From {context.sender}</p>
     <lightning-combobox label="To" value={phone} options={phoneOptions} onchange={changePhone} disabled={inputDisabled}></lightning-combobox>
     <lightning-textarea label="Message" value={message} onchange={changeMessage} maxlength="1000" disabled={inputDisabled} required class="slds-m-top_small"></lightning-textarea>
     <p class="slds-text-body_small slds-text-color_weak">{characterCount}</p>
    </template>
    <p role="status" class="slds-m-top_small">{notice}</p>
   </div>
   <div slot="footer">
    <lightning-button label="Close" onclick={close}></lightning-button>
    <lightning-button variant="brand" label="Send SMS" onclick={submit} disabled={sendDisabled} class="slds-m-left_small"></lightning-button>
   </div>
  </lightning-quick-action-panel>
 </template>
 <template lwc:else>
  <div class="slds-var-p-around_x-small">
   <template lwc:if={context}>
    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">From {context.sender}</p>
    <lightning-combobox label="To" value={phone} options={phoneOptions} onchange={changePhone} disabled={inputDisabled}></lightning-combobox>
    <lightning-textarea label="Message" value={message} onchange={changeMessage} maxlength="1000" disabled={inputDisabled} required class="slds-m-top_small"></lightning-textarea>
    <p class="slds-text-body_small slds-text-color_weak">{characterCount}</p>
    <template lwc:if={showSendButton}>
     <lightning-button variant="brand" label="Send SMS" onclick={submit} disabled={sendDisabled} class="slds-m-top_small"></lightning-button>
    </template>
   </template>
   <p role="status" class="slds-m-top_small">{notice}</p>
  </div>
 </template>
</template>
